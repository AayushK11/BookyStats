[build-system]
requires = ["hatchling>=1.26,<2"]
build-backend = "hatchling.build"

[project]
name = "bookystats"
version = "0.1.0"
description = "Local-first reading data ingestion from StoryGraph and Goodreads."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.12,<5",
    "httpx>=0.28,<1",
    "platformdirs>=4.3,<5",
    "pydantic>=2.10,<3",
    "reportlab>=4.4,<5",
]

[project.optional-dependencies]
cpu = [
    "fastembed==0.9.1",
    "onnxruntime==1.23.2; sys_platform == 'darwin' and platform_machine == 'x86_64'",
    "onnxruntime==1.31.1; sys_platform != 'darwin' or platform_machine != 'x86_64'",
]
cuda = [
    "fastembed-gpu==0.9.1",
    "onnxruntime-gpu==1.26.0",
]
dev = [
    "build>=1.2,<2",
    "mypy>=1.14,<2",
    "pytest>=8.3,<10",
    "pypdf>=6,<7",
    "ruff>=0.9,<1",
    "types-beautifulsoup4",
    "types-reportlab>=4.4,<5",
]

[project.scripts]
booky = "bookystats.cli.commands:main"

[tool.hatch.build.targets.wheel]
packages = ["src/bookystats"]

[tool.hatch.build.targets.sdist]
include = [
    "/src/bookystats",
    "/tests",
    "/*.md",
    "/pyproject.toml",
    "/requirements.txt",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "live: explicitly enabled tests against an account or external provider",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
files = ["src/bookystats"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true
